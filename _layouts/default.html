<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} / {% endif %}D4mianWayne</title>
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css">
</head>

<body style="margin: auto; max-width: 650px; padding-bottom: 50px;">
    <div style="margin-top: 40px;"></div>
    <h1>Ayushman / D4mianWayne</h1>
    <p>Exploit Development &middot; Vulnerability Research &middot; Red Teaming</p>
    <nav style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-weight: 600;">
        <span><a href="{{ site.baseurl }}/index.html">Home</a></span>
        <span><a href="{{ site.baseurl }}/blog.html">Blog</a></span>
        <span><a href="https://github.com/d4mianwayne">GitHub</a></span>
        <span><a href="https://github.com/pwnfuzz">PwnFuzz</a></span>
        <span><a href="https://labs.pwnfuzz.com">PwnFuzz Labs</a></span>
        <span><a href="https://twitter.com/pwnfuzz">Twitter</a></span>
    </nav>

    <div style="margin-top: 40px;">
        {% if page.title %}<h2>{{ page.title }}</h2>{% endif %}
        {% if page.date %}<p style="color: #888;"><em>{{ page.date | date: "%B %d, %Y" }}</em></p>{% endif %}
        
        <div class="post-content">
            {{ content }}
        </div>
    </div>

    <hr>
    <div id="robin"></div>
</body>

</html>
